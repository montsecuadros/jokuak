<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diario de comidas y dolor de tripa (con hoja de Google)</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#faf8f4;--card:#fff;--tx:#2a2622;--mu:#7a7168;--ac:#2f7d6b;--ac2:#e3f1ed;--pn:#c2553d;--pn2:#fbece8;--bd:#e5dfd5;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1917;--card:#262321;--tx:#efe9e1;--mu:#a39a90;--ac:#5cbfa8;--ac2:#243a35;--pn:#e8836b;--pn2:#3b2722;--bd:#3a3531;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1917;--card:#262321;--tx:#efe9e1;--mu:#a39a90;--ac:#5cbfa8;--ac2:#243a35;--pn:#e8836b;--pn2:#3b2722;--bd:#3a3531;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:14px 14px 80px}
h1{font-size:20px;margin:6px 0 12px}
h2{font-size:16px;margin:0 0 10px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:10px 4px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;font-weight:600}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.card.pain{border-color:var(--pn)}
.nav{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.nav button{width:42px;height:42px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:18px}
.nav input{flex:1;min-width:0}
.badge{display:inline-block;padding:4px 10px;border-radius:99px;font-size:13px;font-weight:700;background:var(--ac2);color:var(--ac)}
.badge.sl{background:#fff3d6;color:#8a5a00}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .badge.sl{background:#40351a;color:#f0c76a}}
input,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px;width:100%}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:8px 12px;border-radius:99px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;font-size:14px}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.pain .chip.on{background:var(--pn);border-color:var(--pn)}
.row{display:flex;gap:10px}.row>*{flex:1}
.go{width:100%;margin-top:12px;padding:13px;border:0;border-radius:12px;background:var(--ac);color:#fff;font:inherit;font-weight:700}
.pain .go{background:var(--pn)}
.it{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--bd)}
.it:last-child{border:0}
.it .h{font-weight:700;min-width:48px}
.it .b{flex:1}.it small{color:var(--mu);display:block}
.it.p .b{color:var(--pn)}
.x{border:0;background:none;color:var(--mu);font-size:18px;padding:4px 8px}
.mu{color:var(--mu);font-size:14px}
textarea.rep{min-height:340px;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;white-space:pre}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:14px}
@media print{.tabs,.noprint,.toast{display:none!important}main{padding:0}textarea.rep{border:0;min-height:0;height:auto;overflow:visible}}
</style></head>
<body><main>
<h1>🍽️ Diario de comidas y tripa</h1>
<div id="app"></div>
</main>
<div id="toast" class="toast" hidden></div>
<script>
const $=s=>document.querySelector(s), pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const hm=d=>pad(d.getHours())+':'+pad(d.getMinutes());
const fday=s=>new Date(s+'T12:00').toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MEALS=['Desayuno','Media mañana','Comida','Merienda','Cena','Otro'];
const SYM=['Hinchazón','Gases','Diarrea','Estreñimiento','Náuseas','Vómitos'];
const KEY='diario-tripa-v1';
let S={entries:[],start:'2026-11-20',name:'',tab:'reg',day:ymd(new Date()),url:'',key:'',del:[],last:0,dev:'',err:false,pw:null,locked:false,hid:0};
try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);S.entries=o.entries||[];S.start=o.start||S.start;S.name=o.name||'';S.bk=o.bk||0;S.url=o.url||'';S.key=o.key||'';S.del=o.del||[];S.last=o.last||0;S.dev=o.dev||'';S.pw=o.pw||null;S.locked=!!S.pw}}catch(e){}
if(!S.dev)S.dev=Math.random().toString(36).slice(2,8);
function save(){try{localStorage.setItem(KEY,JSON.stringify({entries:S.entries,start:S.start,name:S.name,bk:S.bk||0,url:S.url,key:S.key,del:S.del,last:S.last,dev:S.dev,pw:S.pw}))}catch(e){}}
function toast(t,ms){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,ms||1800)}
const sl=d=>d>=S.start;
const phase=d=>sl(d)?'Sin lactosa':'Dieta normal';
function guess(){const h=new Date().getHours();return h<10?'Desayuno':h<12?'Media mañana':h<16?'Comida':h<19?'Merienda':'Cena'}
const ts=e=>new Date(e.d+'T'+e.h).getTime();
const sorted=a=>[...a].sort((x,y)=>ts(x)-ts(y));

function tabs(){return (S.entries.length||S.tab=='rep'?'':'<div class="card"><b>¿Vuelves a abrir la app?</b><p class="mu" style="margin:6px 0 10px">Si tenías datos en una copia, cárgala aquí.</p><button class="go" style="margin:0" data-a="ld">Cargar copia</button><input type="file" id="fil" style="display:none"></div>')+'<div class="tabs">'+[['reg','➕ Registrar'],['dia','📋 Día'],['rep','📄 Informe']].map(t=>`<button data-a="tab" data-v="${t[0]}" class="${S.tab==t[0]?'on':''}">${t[1]}</button>`).join('')+'</div>'}
function nav(){return `<div class="nav"><button data-a="prev">‹</button><input type="date" id="dayin" value="${S.day}"><button data-a="next">›</button></div>
<p style="margin:0 0 12px"><span class="badge ${sl(S.day)?'sl':''}">${phase(S.day)}</span> <span class="mu">${fday(S.day)}</span></p>`}
function recent(){const seen=[];sorted(S.entries.filter(e=>e.t=='f')).reverse().forEach(e=>{if(!seen.includes(e.txt)&&seen.length<8)seen.push(e.txt)});return seen}

function regView(){
 const rc=recent();
 return nav()+`<div class="card"><h2>🥣 Comida</h2>
 <div class="chips" id="meals">${MEALS.map(m=>`<button class="chip ${m==guess()?'on':''}" data-a="meal" data-v="${m}">${m}</button>`).join('')}</div>
 <label>Qué ha comido o bebido</label><textarea id="ftxt" rows="2" placeholder="Ej.: tostada con mantequilla, vaso de leche, manzana"></textarea>
 ${rc.length?`<label>Repetir reciente</label><div class="chips">${rc.map(r=>`<button class="chip" data-a="rec" data-v="${esc(r)}">${esc(r.length>26?r.slice(0,26)+'…':r)}</button>`).join('')}</div>`:''}
 <div class="row"><div><label>Hora</label><input type="time" id="fh" value="${hm(new Date())}"></div>
 <div><label>&nbsp;</label><button class="chip" id="lac" data-a="lac" style="width:100%;padding:11px">🥛 Lleva lácteos</button></div></div>
 <button class="go" data-a="addF">Añadir comida</button></div>
 <div class="card pain"><h2>😣 Dolor de tripa</h2>
 <label>Intensidad</label><div class="chips" id="ints">${[['1','1 · leve'],['2','2'],['3','3 · medio'],['4','4'],['5','5 · fuerte']].map(i=>`<button class="chip ${i[0]=='2'?'on':''}" data-a="int" data-v="${i[0]}">${i[1]}</button>`).join('')}</div>
 <label>Otros síntomas</label><div class="chips">${SYM.map(m=>`<button class="chip" data-a="sym" data-v="${m}">${m}</button>`).join('')}</div>
 <div class="row"><div><label>Hora</label><input type="time" id="ph" value="${hm(new Date())}"></div></div>
 <label>Notas (opcional)</label><input id="pn" placeholder="Duración, dónde le duele, qué hizo…">
 <button class="go" data-a="addP">Anotar dolor</button></div>`}

function dayList(d){const l=sorted(S.entries.filter(e=>e.d==d));
 if(!l.length)return '<p class="mu">Aún no hay nada anotado este día.</p>';
 return l.map(e=>e.id==S.edit?editForm(e):e.t=='f'
  ?`<div class="it"><span class="h">${e.h}</span><div class="b">${esc(e.txt)}<small>${esc(e.meal)}${e.lac?' · lácteos':''}</small></div><button class="x" data-a="edit" data-v="${e.id}">✏️</button><button class="x" data-a="del" data-v="${e.id}">✕</button></div>`
  :`<div class="it p"><span class="h">${e.h}</span><div class="b">😣 Dolor de tripa · ${e.int}/5<small>${esc(e.sym.join(', '))}${e.sym.length&&e.note?' · ':''}${esc(e.note||'')}</small></div><button class="x" data-a="edit" data-v="${e.id}">✏️</button><button class="x" data-a="del" data-v="${e.id}">✕</button></div>`).join('')}
function editForm(e){const f=e.t=='f';return `<div class="it" style="display:block"><div class="row"><div><label>Fecha</label><input type="date" id="ed" value="${e.d}"></div><div><label>Hora</label><input type="time" id="eh" value="${e.h}"></div></div>
<label>${f?'Qué comió':'Notas'}</label><input id="et" value="${esc(f?e.txt:(e.note||''))}">
${f?'':`<label>Intensidad (1-5)</label><input type="number" id="ei" min="1" max="5" value="${e.int}">`}
<div class="row" style="margin-top:10px"><button class="chip" data-a="ecancel">Cancelar</button><button class="chip on" data-a="esave" data-v="${e.id}">Guardar cambios</button></div></div>`}
function diaView(){return nav()+`<div class="card">${dayList(S.day)}</div>`}

function report(){
 const days=[...new Set(S.entries.map(e=>e.d))].sort();
 const pains=S.entries.filter(e=>e.t=='p');
 let t=`DIARIO DE COMIDAS Y DOLOR DE TRIPA${S.name?' - '+S.name:''}\n`;
 t+=`Dieta sin lactosa desde: ${fday(S.start)}\n\n`;
 if(!days.length)return t+'(Sin registros todavía)';
 const cnt=(f)=>{const ds=days.filter(f);const n=pains.filter(p=>f(p.d)).length;return `${ds.length} días, ${n} episodios de dolor`+(ds.length?` (${(n/ds.length).toFixed(1)} por día)`:'')};
 t+=`RESUMEN\n- Dieta normal: ${cnt(d=>!sl(d))}\n- Sin lactosa: ${cnt(d=>sl(d))}\n\n`;
 days.forEach(d=>{
  t+=`== ${fday(d)} [${phase(d)}] ==\n`;
  sorted(S.entries.filter(e=>e.d==d)).forEach(e=>{
   if(e.t=='f')t+=`${e.h}  ${e.meal}: ${e.txt}${e.lac?' [lácteos]':''}\n`;
   else{
    const prev=S.entries.filter(f=>f.t=='f'&&ts(f)<=ts(e)&&ts(e)-ts(f)<=4*3600e3).map(f=>f.txt);
    t+=`${e.h}  >> DOLOR ${e.int}/5${e.sym.length?' ('+e.sym.join(', ')+')':''}${e.note?' - '+e.note:''}\n`;
    t+=`      Comidas en las 4 h previas: ${prev.length?prev.join('; '):'ninguna anotada'}\n`;
   }});
  t+='\n'});
 return t.trim()}
function repView(){return `<div class="card noprint"><label style="margin-top:0">Nombre de la niña (opcional)</label><input id="nm" value="${esc(S.name)}">
 <label>Primer día sin lactosa</label><input type="date" id="st" value="${S.start}"></div>
 <div class="card"><textarea class="rep" id="rep" readonly>${esc(report())}</textarea>
 <div class="row noprint" style="margin-top:10px"><button class="go" style="margin:0" data-a="copy">Copiar</button><button class="go" style="margin:0" data-a="share">Compartir</button><button class="go" style="margin:0" data-a="print">Imprimir / PDF</button></div></div>
 <div class="card noprint"><h2>🔀 Unir con el diario de otro móvil</h2><p class="mu" style="margin-top:0">1) Pulsa «Copiar mis datos» y envíaselo por WhatsApp a la otra persona.<br>2) Pega aquí el código que te envíe ella y pulsa «Unir». Se añade lo que falte y se omiten los duplicados.</p><button class="go" style="margin:0 0 10px" data-a="exp">Copiar mis datos</button><textarea id="imp" rows="3" placeholder="Pega aquí el código del otro móvil (empieza por DIARIO1:)"></textarea><button class="go" data-a="imp">Unir y quitar duplicados</button></div>
 <div class="card noprint"><h2>🔒 Contraseña de la app</h2>${S.pw?`<p class="mu" style="margin-top:0">Activada. Se pide al abrir la app y tras unos minutos sin usarla.</p><button class="go" style="margin:0 0 12px" data-a="lockNow">Bloquear ahora</button><label>Contraseña actual</label><input type="password" id="pc" autocomplete="off"><label>Nueva contraseña (vacía para quitarla)</label><input type="password" id="pn" autocomplete="off"><button class="go" data-a="chpw">Cambiar o quitar</button>`:`<p class="mu" style="margin-top:0">Pide una contraseña al abrir la app en este móvil.</p><label>Contraseña (mínimo 4 caracteres)</label><input type="password" id="p1" autocomplete="off"><label>Repetir contraseña</label><input type="password" id="p2" autocomplete="off"><button class="go" data-a="setpw">Poner contraseña</button>`}</div>
 <div class="card noprint"><h2>☁️ Hoja de Google</h2><p class="mu" style="margin-top:0">Pega la dirección del script y la clave. Después se sincroniza solo al anotar y al abrir la app.</p><label>Dirección del script (termina en /exec)</label><input id="gu" value="${esc(S.url)}" placeholder="https://script.google.com/macros/s/.../exec"><label>Clave</label><input id="gk" value="${esc(S.key)}"><div class="row" style="margin-top:12px"><button class="go" style="margin:0" data-a="gsave">Guardar y sincronizar</button><button class="go" style="margin:0" data-a="gsync">Sincronizar ahora</button></div><p class="mu" style="color:var(--pn);margin:10px 0 0">${esc(S.errm||'')}</p></div>
 <div class="card noprint"><h2>💾 Copia en un archivo</h2><p class="mu" style="margin-top:0">${S.bk?'Última copia: '+new Date(S.bk).toLocaleString('es-ES'):'Todavía no has guardado ninguna copia.'}${S.entries.length&&!(S.bk&&Date.now()-S.bk<864e5)?' ⚠️ Conviene guardar una copia hoy.':''}</p><div class="row"><button class="go" style="margin:0" data-a="bk">Guardar copia</button><button class="go" style="margin:0" data-a="ld">Cargar copia</button></div><input type="file" id="fil" style="display:none"></div>
 <p class="mu noprint">Versión 4 (15 noviembre). Los datos se guardan en este navegador y dispositivo (y, con «Guardar copia», también en un archivo). Usa siempre el mismo y envía el informe al médico por mensaje o correo.</p>`}

function render(){if(S.locked){if(!$('#lp'))lockView();return}
 $('#app').innerHTML=cloud()+tabs()+(S.tab=='reg'?regView():S.tab=='dia'?diaView():repView())}
function shift(n){const d=new Date(S.day+'T12:00');d.setDate(d.getDate()+n);S.day=ymd(d);render()}
const sel=(c,el)=>{el.parentNode.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));el.classList.add('on')};

document.addEventListener('click',ev=>{
 const b=ev.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v;
 if(a=='tab'){S.tab=v;render()}
 else if(a=='prev')shift(-1);else if(a=='next')shift(1);
 else if(a=='meal'||a=='int')sel(0,b);
 else if(a=='sym'||a=='lac')b.classList.toggle('on');
 else if(a=='rec'){$('#ftxt').value=v}
 else if(a=='addF'){const txt=$('#ftxt').value.trim();if(!txt){$('#ftxt').focus();return}
  S.entries.push({id:Date.now(),o:S.dev,u:Date.now(),t:'f',d:S.day,h:$('#fh').value||hm(new Date()),meal:$('#meals .on')?.dataset.v||'Otro',txt,lac:$('#lac').classList.contains('on')});
  saveS();render();toast('Comida añadida ✓')}
 else if(a=='addP'){S.entries.push({id:Date.now(),o:S.dev,u:Date.now(),t:'p',d:S.day,h:$('#ph').value||hm(new Date()),int:+($('#ints .on')?.dataset.v||2),sym:[...document.querySelectorAll('.card.pain .chip.on')].map(x=>x.dataset.v).filter(x=>SYM.includes(x)),note:$('#pn').value.trim()});
  saveS();render();toast('Dolor anotado ✓')}
 else if(a=='del'){if(confirm('¿Borrar este registro?')){S.del.push(String(v));S.entries=S.entries.filter(e=>e.id!=v);saveS();render()}}
 else if(a=='copy')doCopy();
 else if(a=='exp')copyText(pack(),'Código copiado ✓');
 else if(a=='imp')doMerge();
 else if(a=='edit'){S.edit=+v;render()}
 else if(a=='ecancel'){S.edit=null;render()}
 else if(a=='esave'){const e=S.entries.find(x=>x.id==v);if(e){e.d=$('#ed').value||e.d;e.h=$('#eh').value||e.h;if(e.t=='f')e.txt=$('#et').value.trim()||e.txt;else{e.note=$('#et').value.trim();e.int=Math.min(5,Math.max(1,+$('#ei').value||e.int))}S.day=e.d;e.u=Date.now();saveS()}S.edit=null;render();toast('Cambios guardados ✓')}
 else if(a=='bk')backup();
 else if(a=='ld')$('#fil').click();
 else if(a=='gsave'){S.url=$('#gu').value.trim();S.key=$('#gk').value.trim();save();sync(true)}
 else if(a=='gsync')sync(true);
 else if(a=='unlock')doUnlock();
 else if(a=='lockNow'){S.locked=true;render()}
 else if(a=='setpw'){const a1=$('#p1').value,a2=$('#p2').value;if(a1.length<4){toast('Mínimo 4 caracteres',3000);return}if(a1!==a2){toast('Las contraseñas no coinciden',3000);return}const sl=Math.random().toString(36).slice(2,10);S.pw={s:sl,h:hp(a1,sl)};save();render();toast('Contraseña activada ✓')}
 else if(a=='chpw'){if(hp($('#pc').value,S.pw.s)!==S.pw.h){toast('La contraseña actual no es correcta',3000);return}const nw=$('#pn').value;if(!nw){S.pw=null;save();render();toast('Contraseña quitada');return}if(nw.length<4){toast('Mínimo 4 caracteres',3000);return}const sl=Math.random().toString(36).slice(2,10);S.pw={s:sl,h:hp(nw,sl)};save();render();toast('Contraseña cambiada ✓')}
 else if(a=='forgot'){if(confirm('Esto borra los datos guardados en este móvil (incluidas la dirección y la clave de la hoja de Google) y quita la contraseña. Lo que ya esté en la hoja de Google no se toca, pero lo que no se haya sincronizado se perderá. ¿Continuar?')){S.entries=[];S.del=[];S.url='';S.key='';S.pw=null;S.last=0;S.bk=0;S.locked=false;save();render()}}
 else if(a=='share'){const t=report();if(navigator.share)navigator.share({title:'Diario de comidas y tripa',text:t}).catch(()=>{});else doCopy()}
 else if(a=='print'){try{window.print()}catch(e){toast('Copia el texto y pégalo en un documento')}}
});
function doCopy(){const t=report();
 const fb=()=>{const r=$('#rep');if(r){r.select();try{document.execCommand('copy');toast('Copiado ✓')}catch(e){toast('Selecciona el texto y cópialo')}}};
 try{navigator.clipboard.writeText(t).then(()=>toast('Copiado ✓'),fb)}catch(e){fb()}}
function copyText(t,msg){const fb=()=>{prompt('Copia este código:',t)};try{navigator.clipboard.writeText(t).then(()=>toast(msg),fb)}catch(e){fb()}}
function pack(){return 'DIARIO1:'+btoa(unescape(encodeURIComponent(JSON.stringify({entries:S.entries,start:S.start,name:S.name}))))}
const norm=s=>[...String(s).toLowerCase().normalize('NFD')].filter(c=>c.charCodeAt(0)<768||c.charCodeAt(0)>879).join('').replace(/[^a-z0-9 ]/g,' ').replace(/ +/g,' ').trim();
function sameTxt(a,b){a=norm(a);b=norm(b);if(a==b||a.includes(b)||b.includes(a))return true;const A=new Set(a.split(' ')),B=new Set(b.split(' '));let i=0;A.forEach(w=>{if(B.has(w))i++});return i/(A.size+B.size-i)>=0.6}
function isDup(a,b){return a.t==b.t&&a.d==b.d&&Math.abs(ts(a)-ts(b))<=15*60e3&&(a.t=='p'||sameTxt(a.txt,b.txt))}
function doMerge(){mergeText($('#imp').value)}
function mergeText(raw){const m=raw.match(/DIARIO1:([A-Za-z0-9+/=]+)/);let o;try{o=JSON.parse(decodeURIComponent(escape(atob(m[1]))))}catch(e){toast('Código no válido. Pega el texto completo que empieza por DIARIO1:',4000);return}
 let add=0,dup=0;(o.entries||[]).forEach(e=>{if(!e||!e.t||!e.d||!e.h)return;if(e.t=='p')e.sym=e.sym||[];if(S.entries.some(x=>isDup(x,e))){dup++;return}if(S.entries.some(x=>x.id==e.id))e.id=Date.now()*1000+Math.floor(Math.random()*1000);S.entries.push(e);add++});
 if(!S.name&&o.name)S.name=o.name;if(o.start&&S.entries.length==add)S.start=o.start;saveS();render();toast('Añadidos '+add+' registros. Duplicados omitidos: '+dup,5000)}
function h53(str,seed){let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0)}
function hp(pw,salt){let x=salt+pw;for(let i=0;i<3000;i++)x=h53(x,i)+salt;return String(x)}
function lockView(){$('#app').innerHTML=`<div class="card" style="margin-top:40px;text-align:center"><h2>🔒 Diario protegido</h2><p class="mu">Escribe la contraseña para entrar.</p><input type="password" id="lp" autocomplete="off" placeholder="Contraseña" style="text-align:center"><p id="lerr" style="color:var(--pn);min-height:20px;margin:8px 0 0"></p><button class="go" data-a="unlock">Entrar</button><p style="margin-top:14px"><button class="x" style="font-size:14px;text-decoration:underline" data-a="forgot">¿Has olvidado la contraseña?</button></p></div>`;setTimeout(()=>{const l=$('#lp');if(l)l.focus()},50)}
function doUnlock(){const l=$('#lp');if(!l||!S.pw)return;if(hp(l.value,S.pw.s)===S.pw.h){S.locked=false;render()}else{$('#lerr').textContent='Contraseña incorrecta';l.value=''}}
document.addEventListener('keydown',ev=>{if(ev.key=='Enter'&&ev.target.id=='lp')doUnlock()});
document.addEventListener('visibilitychange',()=>{if(document.hidden){S.hid=Date.now()}else if(S.pw&&!S.locked&&S.hid&&Date.now()-S.hid>300000){S.locked=true;render()}});
function saveS(){save();clearTimeout(saveS.t);saveS.t=setTimeout(()=>sync(false),1200)}
function cloud(){return S.url?'<p id="cl" class="mu" style="margin:0 0 10px">☁️ '+(sync.busy?'sincronizando…':S.last?'Sincronizado '+new Date(S.last).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}):'Pendiente de sincronizar')+(S.err?' · ⚠️ sin conexión, se enviará más tarde':'')+'</p>':''}
function upd(){const c=$('#cl');if(c)c.outerHTML=cloud()}
function applyRemote(d){
 const dl=new Set((d.deleted||[]).map(String));
 S.entries=S.entries.filter(e=>!dl.has(String(e.id)));
 (d.entries||[]).forEach(r=>{r.id=+r.id||r.id;
  const x=S.entries.find(e=>String(e.id)==String(r.id));
  if(x){if((r.u||0)>(x.u||0))Object.assign(x,r);return}
  const dup=S.entries.find(e=>(e.o||'')!==(r.o||'')&&isDup(e,r));
  if(dup){if(+dup.id<=+r.id){S.del.push(String(r.id))}else{S.del.push(String(dup.id));S.entries=S.entries.filter(e=>e!==dup);S.entries.push(r)}return}
  S.entries.push(r)})}
async function sync(manual){
 if(!S.url||!S.key||sync.busy)return;
 sync.busy=true;upd();
 const sent=S.del.slice();
 S.entries.forEach(e=>{if(!e.o)e.o=S.dev;if(!e.u)e.u=Math.min(Number(e.id)||Date.now(),Date.now())});
 const sig=()=>S.entries.length+':'+S.entries.reduce((a,e)=>Math.max(a,e.u||0),0);
 const before=sig();
 try{
  const r=await fetch(S.url,{method:'POST',body:JSON.stringify({clave:S.key,entries:S.entries.map(e=>Object.assign({},e,{fase:phase(e.d)})),deleted:sent})});
  const tx=await r.text();let d;try{d=JSON.parse(tx)}catch(_){throw new Error('resp:'+tx.replace(/<[^>]+>/g,' ').replace(/ +/g,' ').trim().slice(0,160))}
  if(d.error)throw new Error(d.error);
  applyRemote(d);
  S.del=S.del.filter(x=>!sent.includes(x));S.last=Date.now();S.err=false;S.errm='';save();
  if(manual)toast('Sincronizado ✓');
  if(manual||(sig()!=before&&S.tab!='reg'&&!S.edit))render();
 }catch(e){S.err=true;const m=e.message||'';S.errm=m=='clave'?'Clave incorrecta: no coincide con la del script':m.indexOf('resp:')==0?'El script respondió algo inesperado: '+m.slice(5):'No se pudo conectar ('+m+'). El visor o navegador puede estar bloqueando la conexión.';if(manual){toast(S.errm,9000);if(S.tab=='rep'&&!S.locked)render()}}
 sync.busy=false;upd();
}
function mark(){S.bk=Date.now();save();render();toast('Copia guardada ✓')}
async function backup(){const txt=pack(),name='diario-tripa-'+ymd(new Date())+'.txt';
 try{const f=new File([txt],name,{type:'text/plain'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Copia del diario'});mark();return}}catch(e){if(e&&e.name=='AbortError')return}
 try{const u=URL.createObjectURL(new Blob([txt],{type:'text/plain'}));const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);mark()}catch(e){copyText(txt,'Código copiado ✓')}}
document.addEventListener('change',ev=>{
 if(ev.target.id=='fil'&&ev.target.files[0]){ev.target.files[0].text().then(mergeText).catch(()=>toast('No se pudo leer el archivo',4000));ev.target.value=''}
 if(ev.target.id=='dayin'&&ev.target.value){S.day=ev.target.value;render()}
 if(ev.target.id=='nm'){S.name=ev.target.value.trim();save();render()}
 if(ev.target.id=='st'&&ev.target.value){S.start=ev.target.value;save();render()}
});
render();
try{navigator.storage.persist()}catch(e){}
if(S.url)sync(false);
setInterval(()=>{if(S.url&&!document.hidden)sync(false)},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.url)sync(false)});
</script></body></html>
